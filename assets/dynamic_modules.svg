<svg xmlns="http://www.w3.org/2000/svg" width="650" height="230" viewBox="0 0 650 230">
  <style>
    .bg { fill: #050505; rx: 6px; }
    .text {
      font-family: 'Consolas', 'Courier New', monospace;
      font-size: 14px;
      fill: #ffffff;
    }
    .pct {
      font-weight: bold;
    }
    .bar-bg {
      fill: #161b22;
      rx: 2px;
    }

    .lang-0 { fill: #ff5555; }
    .bar-0 {
      fill: #ff5555;
      rx: 2px;
      animation: load-0 1.5s cubic-bezier(0.4, 0, 0.2, 1) forwards, fluctuate-0 3.5s ease-in-out 1.5s infinite;
    }
    @keyframes load-0 {
      0% { width: 0; }
      100% { width: 132px; }
    }
    @keyframes fluctuate-0 {
      0%, 100% { width: 132px; }
      33% { width: 128px; }
      66% { width: 135px; }
    }

    .lang-1 { fill: #d946ef; }
    .bar-1 {
      fill: #d946ef;
      rx: 2px;
      animation: load-1 1.5s cubic-bezier(0.4, 0, 0.2, 1) forwards, fluctuate-1 4.2s ease-in-out 1.5s infinite;
    }
    @keyframes load-1 {
      0% { width: 0; }
      100% { width: 58px; }
    }
    @keyframes fluctuate-1 {
      0%, 100% { width: 58px; }
      33% { width: 54px; }
      66% { width: 61px; }
    }

    .lang-2 { fill: #ffb86c; }
    .bar-2 {
      fill: #ffb86c;
      rx: 2px;
      animation: load-2 1.5s cubic-bezier(0.4, 0, 0.2, 1) forwards, fluctuate-2 4.9s ease-in-out 1.5s infinite;
    }
    @keyframes load-2 {
      0% { width: 0; }
      100% { width: 57px; }
    }
    @keyframes fluctuate-2 {
      0%, 100% { width: 57px; }
      33% { width: 53px; }
      66% { width: 60px; }
    }

    .lang-3 { fill: #f1fa8c; }
    .bar-3 {
      fill: #f1fa8c;
      rx: 2px;
      animation: load-3 1.5s cubic-bezier(0.4, 0, 0.2, 1) forwards, fluctuate-3 5.6s ease-in-out 1.5s infinite;
    }
    @keyframes load-3 {
      0% { width: 0; }
      100% { width: 38px; }
    }
    @keyframes fluctuate-3 {
      0%, 100% { width: 38px; }
      33% { width: 34px; }
      66% { width: 41px; }
    }

    .lang-4 { fill: #8be9fd; }
    .bar-4 {
      fill: #8be9fd;
      rx: 2px;
      animation: load-4 1.5s cubic-bezier(0.4, 0, 0.2, 1) forwards, fluctuate-4 6.3s ease-in-out 1.5s infinite;
    }
    @keyframes load-4 {
      0% { width: 0; }
      100% { width: 26px; }
    }
    @keyframes fluctuate-4 {
      0%, 100% { width: 26px; }
      33% { width: 22px; }
      66% { width: 29px; }
    }

    .lang-5 { fill: #50fa7b; }
    .bar-5 {
      fill: #50fa7b;
      rx: 2px;
      animation: load-5 1.5s cubic-bezier(0.4, 0, 0.2, 1) forwards, fluctuate-5 7.0s ease-in-out 1.5s infinite;
    }
    @keyframes load-5 {
      0% { width: 0; }
      100% { width: 21px; }
    }
    @keyframes fluctuate-5 {
      0%, 100% { width: 21px; }
      33% { width: 17px; }
      66% { width: 24px; }
    }
  </style>

  <defs>
    <pattern id="stripes" width="40" height="40" patternUnits="userSpaceOnUse">
      <polygon points="0,20 20,0 40,0 0,40" fill="#0AFFB0" fill-opacity="0.04"/>
      <polygon points="40,20 40,40 20,40" fill="#0AFFB0" fill-opacity="0.04"/>
    </pattern>
  </defs>
  
  <rect class="bg" width="100%" height="100%" />
  
  <rect x="-50" y="-50" width="150%" height="150%" fill="url(#stripes)">
    <animateTransform attributeName="transform" type="translate" values="0,0; -40,0" dur="3s" repeatCount="indefinite" />
  </rect>

  <text class="text lang-0" x="20" y="24">HTML</text>
  <text class="text" x="160" y="24">[</text>
  <rect class="bar-bg" x="170" y="14" width="360" height="10" />
  <rect class="bar-0" x="170" y="14" width="0" height="10" />
  <text class="text" x="535" y="24">]</text>
  <text class="text pct lang-0" x="560" y="24">37%</text>

  <text class="text lang-1" x="20" y="59">Jupyter Notebook</text>
  <text class="text" x="160" y="59">[</text>
  <rect class="bar-bg" x="170" y="49" width="360" height="10" />
  <rect class="bar-1" x="170" y="49" width="0" height="10" />
  <text class="text" x="535" y="59">]</text>
  <text class="text pct lang-1" x="560" y="59">16%</text>

  <text class="text lang-2" x="20" y="94">Java</text>
  <text class="text" x="160" y="94">[</text>
  <rect class="bar-bg" x="170" y="84" width="360" height="10" />
  <rect class="bar-2" x="170" y="84" width="0" height="10" />
  <text class="text" x="535" y="94">]</text>
  <text class="text pct lang-2" x="560" y="94">16%</text>

  <text class="text lang-3" x="20" y="129">JavaScript</text>
  <text class="text" x="160" y="129">[</text>
  <rect class="bar-bg" x="170" y="119" width="360" height="10" />
  <rect class="bar-3" x="170" y="119" width="0" height="10" />
  <text class="text" x="535" y="129">]</text>
  <text class="text pct lang-3" x="560" y="129">11%</text>

  <text class="text lang-4" x="20" y="164">Python</text>
  <text class="text" x="160" y="164">[</text>
  <rect class="bar-bg" x="170" y="154" width="360" height="10" />
  <rect class="bar-4" x="170" y="154" width="0" height="10" />
  <text class="text" x="535" y="164">]</text>
  <text class="text pct lang-4" x="560" y="164">7%</text>

  <text class="text lang-5" x="20" y="199">CSS</text>
  <text class="text" x="160" y="199">[</text>
  <rect class="bar-bg" x="170" y="189" width="360" height="10" />
  <rect class="bar-5" x="170" y="189" width="0" height="10" />
  <text class="text" x="535" y="199">]</text>
  <text class="text pct lang-5" x="560" y="199">6%</text>
</svg>