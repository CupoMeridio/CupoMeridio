<svg xmlns="http://www.w3.org/2000/svg" width="650" height="130" viewBox="0 0 650 130">
  <style>
    .bg { fill: #050505; rx: 6px; }
    .text {
      font-family: 'Consolas', 'Courier New', monospace;
      font-size: 14px;
      fill: #ffffff;
      opacity: 0;
    }
    .prompt { fill: #0AFFB0; font-weight: bold; }
    .accent { fill: #0AFFB0; }
    .sys { fill: #ff5f56; font-weight: bold; }
    
    .cursor {
      fill: #ffffff;
      animation: blink 1s step-end infinite;
    }
    
    .l1 { animation: type 0.5s forwards; }
    .l2 { animation: type 0.5s forwards; animation-delay: 0.2s; }
    .l3 { animation: fade 0.8s forwards; animation-delay: 1.0s; }
    .l4 { animation: fade 0.8s forwards; animation-delay: 1.5s; }

    @keyframes type {
      0% { opacity: 0; }
      100% { opacity: 1; }
    }
    @keyframes fade {
      0% { opacity: 0; }
      100% { opacity: 1; }
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    @keyframes radar-pulse {
      0% { r: 0; opacity: 1; stroke-width: 2; }
      100% { r: 350px; opacity: 0; stroke-width: 10; }
    }
    .radar {
      fill: none;
      stroke: #0AFFB0;
      opacity: 0;
      animation: radar-pulse 6s ease-out infinite;
    }
    .r1 { animation-delay: 0s; }
    .r2 { animation-delay: 3s; }
  </style>

  <rect class="bg" width="100%" height="100%" />

  <circle class="radar r1" cx="325" cy="65" />
  <circle class="radar r2" cx="325" cy="65" />

  <!-- Command Line -->
  <text class="text l1" x="20" y="30"><tspan class="prompt">┌─[vittorio@unisa]─[~]</tspan></text>
  <text class="text l2" x="20" y="50"><tspan class="prompt">└──╼ $</tspan> cat contact.log<tspan class="cursor">_</tspan></text>

  <!-- Output -->
  <text class="text l3" x="20" y="80" xml:space="preserve"> <tspan class="accent">mail</tspan>     :: vittoriopostiglione22@gmail.com</text>
  
  <text class="text l4" x="20" y="110" xml:space="preserve">[<tspan class="sys">SYSTEM</tspan>] connection to viewer established — no further errors logged.</text>
</svg>
