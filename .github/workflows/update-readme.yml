name: Update README live feed

on:
  schedule:
    # ogni giorno alle 06:00 UTC — modifica l'orario se vuoi
    - cron: "0 6 * * *"
  workflow_dispatch: {}   # bottone "Run workflow" manuale su GitHub
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update dynamic section
        env:
          PROFILE_USERNAME: CupoMeridio
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_readme.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md assets/dynamic_modules.svg assets/live_telemetry.svg
          git diff --cached --quiet || git commit -m "chore: sync dynamic SVGs"
          git push
