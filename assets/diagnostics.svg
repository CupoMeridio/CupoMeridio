<svg xmlns="http://www.w3.org/2000/svg" width="650" height="140" viewBox="0 0 650 140">
  <style>
    .bg { fill: #050505; }
    .text {
      font-family: 'Consolas', 'Courier New', monospace;
      font-size: 14px;
      fill: #ffffff;
      opacity: 0;
      animation: type 0.5s forwards;
    }
    .accent { fill: #0AFFB0; }
    .hl { fill: #ff5f56; font-weight: bold; }
    .val { fill: #f1fa8c; }
    
    .l1 { animation-delay: 0.1s; }
    .l2 { animation-delay: 0.3s; }
    .l3 { animation-delay: 0.5s; }
    .l4 { animation-delay: 0.7s; }

    @keyframes type {
      0% { opacity: 0; }
      100% { opacity: 1; }
    }
  </style>

  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#0AFFB0" stroke-width="0.5" stroke-opacity="0.05" />
    </pattern>
  </defs>

  <path class="bg" d="M0 0 H650 V132 A8 8 0 0 1 642 140 H8 A8 8 0 0 1 0 132 Z" />
  <rect width="100%" height="100%" fill="url(#grid)" />

  <text class="text l1" x="20" y="30" xml:space="preserve"><tspan class="accent">[+]</tspan> RUNNING SYSTEM DIAGNOSTICS...</text>
  <text class="text l2" x="20" y="60" xml:space="preserve">    DATA.REPOSITORIES <tspan class="hl">></tspan>  <tspan class="val">14</tspan> DEPLOYED</text>
  <text class="text l3" x="20" y="85" xml:space="preserve">    DATA.STARGAZERS   <tspan class="hl">></tspan>  <tspan class="val">23</tspan> DETECTED</text>
  <text class="text l4" x="20" y="110" xml:space="preserve">    DATA.NETWORK      <tspan class="hl">></tspan>  <tspan class="val">5</tspan> FOLLOWERS, <tspan class="val">4</tspan> FOLLOWING</text>
</svg>