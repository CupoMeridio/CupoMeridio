<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="110" viewBox="0 0 650 110">
  <style>
    .bg { fill: #050505; rx: 8px; }
    .text {
      font-family: 'Consolas', 'Courier New', monospace;
      font-size: 15px;
      font-weight: bold;
      fill: #ffffff;
      letter-spacing: 1px;
    }
    .accent { fill: #0AFFB0; }
    
    .btn { r: 6px; }
    .btn-red { fill: #ff5f56; }
    .btn-yel { fill: #ffbd2e; }
    .btn-grn { fill: #27c93f; }
    
    .glow { animation: pulse 3s infinite; }
    @keyframes pulse {
      0%, 100% { opacity: 0.9; }
      50% { opacity: 0.5; }
    }

    .cursor {
      animation: blink 1s infinite;
      fill: #0AFFB0;
    }
    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
  </style>

  <rect class="bg" width="100%" height="100%" />
  
  <circle class="btn btn-red" cx="20" cy="20" />
  <circle class="btn btn-yel" cx="40" cy="20" />
  <circle class="btn btn-grn" cx="60" cy="20" />

  <text class="text accent glow" x="325" y="45" text-anchor="middle" xml:space="preserve">▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓</text>
  <text class="text" x="325" y="70" text-anchor="middle" xml:space="preserve">S Y S T E M   D I A G N O S T I C S <tspan class="cursor">_</tspan></text>
  <text class="text accent glow" x="325" y="95" text-anchor="middle" xml:space="preserve">▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓</text>
</svg>
