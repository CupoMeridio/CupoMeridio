<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="110" viewBox="0 0 650 110">
  <style>
    .bg { fill: #050505; rx: 8px; }
    .text {
      font-family: 'Consolas', 'Courier New', monospace;
      font-size: 15px;
      font-weight: bold;
      fill: #ffffff;
      letter-spacing: 1px;
    }
    .accent { fill: #0AFFB0; }
    
    .btn { r: 6px; }
    .btn-red { fill: #ff5f56; }
    .btn-yel { fill: #ffbd2e; }
    .btn-grn { fill: #27c93f; }
    
    .glow { animation: pulse 3s infinite; }
    @keyframes pulse {
      0%, 100% { opacity: 0.9; }
      50% { opacity: 0.5; }
    }

    .cursor {
      animation: blink 1s infinite;
      fill: #0AFFB0;
    }
    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
  </style>

  <defs>
    <pattern id="stripes" width="40" height="40" patternUnits="userSpaceOnUse">
      <polygon points="0,20 20,0 40,0 0,40" fill="#0AFFB0" fill-opacity="0.04"/>
      <polygon points="40,20 40,40 20,40" fill="#0AFFB0" fill-opacity="0.04"/>
    </pattern>
  </defs>

  <path class="bg" d="M8 0 H642 A8 8 0 0 1 650 8 V110 H0 V110 A0 0 0 0 1 0 110 V8 A8 8 0 0 1 8 0 Z" />
  
  <rect x="-50" y="-50" width="150%" height="150%" fill="url(#stripes)">
    <animateTransform attributeName="transform" type="translate" values="0,0; -40,0" dur="3s" repeatCount="indefinite" />
  </rect>
  
  <circle class="btn btn-red" cx="20" cy="20" />
  <circle class="btn btn-yel" cx="40" cy="20" />
  <circle class="btn btn-grn" cx="60" cy="20" />

  <text class="text accent glow" x="325" y="45" text-anchor="middle" xml:space="preserve">▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓</text>
  <text class="text" x="325" y="70" text-anchor="middle" xml:space="preserve">M O D U L E S   ::   L O A D E D <tspan class="cursor">_</tspan></text>
  <text class="text accent glow" x="325" y="95" text-anchor="middle" xml:space="preserve">▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓</text>
</svg>
