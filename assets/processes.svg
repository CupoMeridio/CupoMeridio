<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="1420" viewBox="0 0 650 1420">
  <style>
    .bg { fill: #050505; }
    .text {
      font-family: 'Consolas', 'Courier New', monospace;
      font-size: 14px;
      fill: #ffffff;
      opacity: 0;
    }
    .accent { fill: #0AFFB0; }
    .tree { fill: #444444; }
    .tags { fill: #ffbd2e; }
    .link { fill: #58a6ff; }


    .p0 {
      animation: fade 0.8s ease-out forwards;
      animation-delay: 0.0s;
    }

    .p1 {
      animation: fade 0.8s ease-out forwards;
      animation-delay: 0.4s;
    }

    .p2 {
      animation: fade 0.8s ease-out forwards;
      animation-delay: 0.8s;
    }

    .p3 {
      animation: fade 0.8s ease-out forwards;
      animation-delay: 1.2000000000000002s;
    }

    .p4 {
      animation: fade 0.8s ease-out forwards;
      animation-delay: 1.6s;
    }

    .p5 {
      animation: fade 0.8s ease-out forwards;
      animation-delay: 2.0s;
    }

    .p6 {
      animation: fade 0.8s ease-out forwards;
      animation-delay: 2.4000000000000004s;
    }

    .p7 {
      animation: fade 0.8s ease-out forwards;
      animation-delay: 2.8000000000000003s;
    }

    .p8 {
      animation: fade 0.8s ease-out forwards;
      animation-delay: 3.2s;
    }

    .p9 {
      animation: fade 0.8s ease-out forwards;
      animation-delay: 3.6s;
    }

    .p10 {
      animation: fade 0.8s ease-out forwards;
      animation-delay: 4.0s;
    }

    @keyframes fade {
      0% { opacity: 0; }
      100% { opacity: 1; }
    }
  </style>

  <defs>
    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#0AFFB0" fill-opacity="0.05" />
    </pattern>
  </defs>

  <path class="bg" d="M0 0 H650 V1412 A8 8 0 0 1 642 1420 H8 A8 8 0 0 1 0 1412 Z" />
  
  <rect width="100%" height="100%" fill="url(#scanlines)">
    <animateTransform attributeName="transform" type="translate" values="0,0; 0,-4" dur="2s" repeatCount="indefinite" />
  </rect>

  <text class="text p0" x="20" y="20" xml:space="preserve">PID 0001 ── <tspan class="accent">java-music-playlist-manager</tspan> ─────────────────── <tspan class="accent">[RUNNING]</tspan></text>
  <text class="text p0" x="20" y="40" xml:space="preserve"><tspan class="tree">   │</tspan>  <tspan class="tags">[self-driven]</tspan>  Desktop music player, JavaFX. Started as a</text>
  <text class="text p0" x="20" y="60" xml:space="preserve"><tspan class="tree">   │</tspan>  Software Architecture exam project — still being extended</text>
  <text class="text p0" x="20" y="80" xml:space="preserve"><tspan class="tree">   │</tspan>  for fun post-exam. Ports &amp; Adapters, Factory, Command/Undo,</text>
  <text class="text p0" x="20" y="100" xml:space="preserve"><tspan class="tree">   │</tspan>  125 unit tests, custom Persona-style UI theming engine.</text>
  <text class="text p0" x="20" y="120" xml:space="preserve"><tspan class="tree">   └─→</tspan> <tspan class="link">github.com/CupoMeridio/Java-Music-Playlist-Manager</tspan></text>
  <text class="text p1" x="20" y="160" xml:space="preserve">PID 0002 ── <tspan class="accent">waste-type-classifier</tspan> ───────────────────────── <tspan class="accent">[RUNNING]</tspan></text>
  <text class="text p1" x="20" y="180" xml:space="preserve"><tspan class="tree">   │</tspan>  <tspan class="tags">[exam · ml]</tspan>  8-class waste image classification, PyTorch.</text>
  <text class="text p1" x="20" y="200" xml:space="preserve"><tspan class="tree">   │</tspan>  Two-phase transfer learning across EfficientNet B0/B2/B3,</text>
  <text class="text p1" x="20" y="220" xml:space="preserve"><tspan class="tree">   │</tspan>  temperature-scaled reject option for open-set recognition,</text>
  <text class="text p1" x="20" y="240" xml:space="preserve"><tspan class="tree">   │</tspan>  Grad-CAM interpretability. Full experiment suite, not just</text>
  <text class="text p1" x="20" y="260" xml:space="preserve"><tspan class="tree">   │</tspan>  a single trained model.</text>
  <text class="text p1" x="20" y="280" xml:space="preserve"><tspan class="tree">   └─→</tspan> <tspan class="link">github.com/CupoMeridio/waste-type-classifier</tspan></text>
  <text class="text p2" x="20" y="320" xml:space="preserve">PID 0003 ── <tspan class="accent">granpremio-mivia-2025</tspan> ───────────────────────── <tspan class="accent">[RUNNING]</tspan></text>
  <text class="text p2" x="20" y="340" xml:space="preserve"><tspan class="tree">   │</tspan>  <tspan class="tags">[exam · ai]</tspan>  Autonomous driving for TORCS. Java client +</text>
  <text class="text p2" x="20" y="360" xml:space="preserve"><tspan class="tree">   │</tspan>  KNN (KD-Tree) and MLP neural net over UDP, compared against</text>
  <text class="text p2" x="20" y="380" xml:space="preserve"><tspan class="tree">   │</tspan>  a traditional rule-based driver as baseline.</text>
  <text class="text p2" x="20" y="400" xml:space="preserve"><tspan class="tree">   └─→</tspan> <tspan class="link">github.com/CupoMeridio/Granpremio-MIVIA-2025</tspan></text>
  <text class="text p3" x="20" y="440" xml:space="preserve">PID 0004 ── <tspan class="accent">unisafe-vote</tspan> ────────────────────────────────── <tspan class="accent">[RUNNING]</tspan></text>
  <text class="text p3" x="20" y="460" xml:space="preserve"><tspan class="tree">   │</tspan>  <tspan class="tags">[exam · security]</tspan>  E2E-verifiable e-voting proof of concept.</text>
  <text class="text p3" x="20" y="480" xml:space="preserve"><tspan class="tree">   │</tspan>  RSA-OAEP + RSA-PSS, Merkle tree bulletin board, TLS between</text>
  <text class="text p3" x="20" y="500" xml:space="preserve"><tspan class="tree">   │</tspan>  services, simulated attacks (MITM, replay, DoS) as test suite.</text>
  <text class="text p3" x="20" y="520" xml:space="preserve"><tspan class="tree">   └─→</tspan> <tspan class="link">github.com/CupoMeridio/UniSafe-Vote</tspan></text>
  <text class="text p4" x="20" y="560" xml:space="preserve">PID 0005 ── <tspan class="accent">launchpad-online</tspan> ────────────────────────────── <tspan class="accent">[RUNNING]</tspan></text>
  <text class="text p4" x="20" y="580" xml:space="preserve"><tspan class="tree">   │</tspan>  <tspan class="tags">[self-driven]</tspan>  Not an exam — built because I wanted a</text>
  <text class="text p4" x="20" y="600" xml:space="preserve"><tspan class="tree">   │</tspan>  Launchpad performance tool. PWA, Web MIDI + Web Audio API,</text>
  <text class="text p4" x="20" y="620" xml:space="preserve"><tspan class="tree">   │</tspan>  30+ built-in lighting animations, offline-capable.</text>
  <text class="text p4" x="20" y="640" xml:space="preserve"><tspan class="tree">   └─→</tspan> <tspan class="link">github.com/CupoMeridio/Launchpad-Online</tspan></text>
  <text class="text p5" x="20" y="680" xml:space="preserve">PID 0006 ── <tspan class="accent">advanced_tc</tspan> ─────────────────────────────────── <tspan class="accent">[RUNNING]</tspan></text>
  <text class="text p5" x="20" y="700" xml:space="preserve"><tspan class="tree">   │</tspan>  <tspan class="tags">[internship]</tspan>  Custom ERPNext/Frappe app: a real</text>
  <text class="text p5" x="20" y="720" xml:space="preserve"><tspan class="tree">   │</tspan>  calendar UI for timesheet management, replacing the stock</text>
  <text class="text p5" x="20" y="740" xml:space="preserve"><tspan class="tree">   │</tspan>  tabular view. Python backend, FullCalendar.js frontend,</text>
  <text class="text p5" x="20" y="760" xml:space="preserve"><tspan class="tree">   │</tspan>  role-based project access control.</text>
  <text class="text p5" x="20" y="780" xml:space="preserve"><tspan class="tree">   └─→</tspan> <tspan class="link">github.com/CupoMeridio/advanced_tc</tspan></text>
  <text class="text p6" x="20" y="820" xml:space="preserve">PID 0007 ── <tspan class="accent">stm32-hal-modular-drivers</tspan> ───────────────────── <tspan class="accent">[RUNNING]</tspan></text>
  <text class="text p6" x="20" y="840" xml:space="preserve"><tspan class="tree">   │</tspan>  <tspan class="tags">[exam · embedded]</tspan>  OOP-style C drivers for STM32 (LED,</text>
  <text class="text p6" x="20" y="860" xml:space="preserve"><tspan class="tree">   │</tspan>  button, FIFO queue, servo, RTC). Fully non-blocking, no</text>
  <text class="text p6" x="20" y="880" xml:space="preserve"><tspan class="tree">   │</tspan>  HAL_Delay, null-pointer guarded throughout.</text>
  <text class="text p6" x="20" y="900" xml:space="preserve"><tspan class="tree">   └─→</tspan> <tspan class="link">github.com/CupoMeridio/stm32-hal-modular-drivers</tspan></text>
  <text class="text p7" x="20" y="940" xml:space="preserve">PID 0008 ── <tspan class="accent">rubrica-java-mvc</tspan> ────────────────────────────── <tspan class="accent">[RUNNING]</tspan></text>
  <text class="text p7" x="20" y="960" xml:space="preserve"><tspan class="tree">   │</tspan>  <tspan class="tags">[exam]</tspan>  Desktop contact manager, JavaFX + PostgreSQL.</text>
  <text class="text p7" x="20" y="980" xml:space="preserve"><tspan class="tree">   │</tspan>  Full MVC architecture, DAO pattern for data persistence.</text>
  <text class="text p7" x="20" y="1000" xml:space="preserve"><tspan class="tree">   │</tspan>  Features: BCrypt auth, advanced search, and CSV export.</text>
  <text class="text p7" x="20" y="1020" xml:space="preserve"><tspan class="tree">   └─→</tspan> <tspan class="link">github.com/CupoMeridio/rubrica-java-mvc</tspan></text>
  <text class="text p8" x="20" y="1060" xml:space="preserve">PID 0009 ── <tspan class="accent">wordageddon-g17</tspan> ─────────────────────────────── <tspan class="accent">[RUNNING]</tspan></text>
  <text class="text p8" x="20" y="1080" xml:space="preserve"><tspan class="tree">   │</tspan>  <tspan class="tags">[exam]</tspan>  Educational JavaFX memory game on word frequencies.</text>
  <text class="text p8" x="20" y="1100" xml:space="preserve"><tspan class="tree">   │</tspan>  Multi-language document support and 4 quiz modes.</text>
  <text class="text p8" x="20" y="1120" xml:space="preserve"><tspan class="tree">   │</tspan>  PostgreSQL cloud db (Aiven) with MVC and DAO layers.</text>
  <text class="text p8" x="20" y="1140" xml:space="preserve"><tspan class="tree">   └─→</tspan> <tspan class="link">github.com/CupoMeridio/Wordageddon-G17</tspan></text>
  <text class="text p9" x="20" y="1180" xml:space="preserve">PID 0010 ── <tspan class="accent">beyond-reality-journeys</tspan> ─────────────────────── <tspan class="accent">[RUNNING]</tspan></text>
  <text class="text p9" x="20" y="1200" xml:space="preserve"><tspan class="tree">   │</tspan>  <tspan class="tags">[exam · web]</tspan>  Fantasy trips booking platform in PHP 8, JS and MySQL.</text>
  <text class="text p9" x="20" y="1220" xml:space="preserve"><tspan class="tree">   │</tspan>  Stripe API for payments, FPDF for receipts, and AJAX</text>
  <text class="text p9" x="20" y="1240" xml:space="preserve"><tspan class="tree">   │</tspan>  for async interactions and real-time reviews.</text>
  <text class="text p9" x="20" y="1260" xml:space="preserve"><tspan class="tree">   └─→</tspan> <tspan class="link">github.com/CupoMeridio/beyond-reality-journeys</tspan></text>
  <text class="text p10" x="20" y="1300" xml:space="preserve">PID 0011 ── <tspan class="accent">vinyl-collection-app</tspan> ────────────────────────── <tspan class="accent">[RUNNING]</tspan></text>
  <text class="text p10" x="20" y="1320" xml:space="preserve"><tspan class="tree">   │</tspan>  <tspan class="tags">[exam · mobile]</tspan>  Flutter mobile app for managing vinyl collections.</text>
  <text class="text p10" x="20" y="1340" xml:space="preserve"><tspan class="tree">   │</tspan>  SQLite database, Provider state management, charts (fl_chart),</text>
  <text class="text p10" x="20" y="1360" xml:space="preserve"><tspan class="tree">   │</tspan>  and Singleton/Repository patterns. Full CRUD and image upload.</text>
  <text class="text p10" x="20" y="1380" xml:space="preserve"><tspan class="tree">   └─→</tspan> <tspan class="link">github.com/CupoMeridio/vinyl_collection_app_gruppo_16</tspan></text>
</svg>
