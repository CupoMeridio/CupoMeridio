<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="185" viewBox="0 0 650 185">
  <style>
    .card-bg {
      fill: #050505;
      stroke: #161b22;
      stroke-width: 1px;
    }
    .border-glow {
      stroke: #0AFFB0;
      stroke-opacity: 0.22;
      stroke-width: 1px;
      fill: none;
    }
    .text {
      font-family: 'Consolas', 'Courier New', monospace;
      font-size: 14px;
      fill: #ffffff;
    }
    .accent { fill: #0AFFB0; }
    .tree { fill: #444444; }
    .tags { fill: #ffbd2e; }
    .link { fill: #58a6ff; font-weight: 500; }
    .status {
      animation: pulse 2s infinite alternate;
    }
    @keyframes pulse {
      0% { opacity: 0.7; }
      100% { opacity: 1; }
    }
  </style>

  <defs>
    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#0AFFB0" fill-opacity="0.03" />
    </pattern>
  </defs>

  <!-- Background card con bordo cyberpunk sottile -->
  <rect class="card-bg" x="0.5" y="0.5" width="649" height="184" rx="8" />
  <rect class="border-glow" x="0.5" y="0.5" width="649" height="184" rx="8" />
  
  <!-- Scanlines animate -->
  <rect width="100%" height="100%" fill="url(#scanlines)" rx="8">
    <animateTransform attributeName="transform" type="translate" values="0,0; 0,-4" dur="2s" repeatCount="indefinite" />
  </rect>

  <!-- Header processo -->
  <text class="text" x="20" y="30" xml:space="preserve">PID 0002 ── <tspan class="accent">waste-type-classifier</tspan> ────────────────────── <tspan class="accent status">[RUNNING]</tspan></text>

  <!-- Contenuto descrittivo e link -->
  <text class="text" x="20" y="55" xml:space="preserve"><tspan class="tree">   │</tspan>  <tspan class="tags">[exam · ml]</tspan>  8-class waste image classification, PyTorch.</text>
  <text class="text" x="20" y="75" xml:space="preserve"><tspan class="tree">   │</tspan>  Two-phase transfer learning across EfficientNet B0/B2/B3,</text>
  <text class="text" x="20" y="95" xml:space="preserve"><tspan class="tree">   │</tspan>  temperature-scaled reject option for open-set recognition,</text>
  <text class="text" x="20" y="115" xml:space="preserve"><tspan class="tree">   │</tspan>  Grad-CAM interpretability. Full experiment suite, not just</text>
  <text class="text" x="20" y="135" xml:space="preserve"><tspan class="tree">   │</tspan>  a single trained model.</text>
  <text class="text" x="20" y="159" xml:space="preserve"><tspan class="tree">   └─→</tspan> <tspan class="link">github.com/CupoMeridio/waste-type-classifier</tspan> <tspan class="accent">↗</tspan></text>
</svg>